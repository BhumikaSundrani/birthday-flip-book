<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>The Boy Who Asked If I Was Artificial</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:Georgia,"Times New Roman",serif;background:#211914;color:#f8eee0}
  body{display:flex;align-items:center;justify-content:center;overflow:hidden}
  .app{width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
       background:
       radial-gradient(circle at 50% 35%,rgba(255,218,160,.13),transparent 38%),
       linear-gradient(135deg,#17110f,#30221b 55%,#130e0c)}
  .title{position:absolute;top:18px;left:20px;right:20px;text-align:center;z-index:20;
         font-size:clamp(14px,2vw,21px);letter-spacing:.08em;color:#ead7bd}
  .subtitle{position:absolute;bottom:16px;left:20px;right:20px;text-align:center;z-index:20;
            font-size:12px;color:#cdbca7;opacity:.8}
  .stage{position:relative;width:min(76vw,560px);height:min(76vh,760px);perspective:1800px}
  #book{width:100%;height:100%;visibility:hidden;opacity:0;transition:opacity .45s ease}
  .closed-book{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;
               transition:opacity .55s ease;pointer-events:auto}
  .closed-book.hide{opacity:0;pointer-events:none}
  .closed-cover{width:100%;height:100%;border-radius:5px 14px 14px 5px;overflow:hidden;
                transform-origin:left center;transform:rotateY(0deg);
                box-shadow:0 22px 55px rgba(0,0,0,.55),inset 0 0 0 7px rgba(86,45,21,.28);
                background:#5b2d1c;position:relative}
  .closed-cover:after{content:"";position:absolute;left:0;top:0;bottom:0;width:18px;
                      background:linear-gradient(90deg,rgba(0,0,0,.42),rgba(255,255,255,.08),transparent);
                      pointer-events:none}
  .closed-cover img{width:100%;height:100%;object-fit:cover;display:block}
  .open-btn,.close-btn{position:absolute;z-index:30;border:1px solid rgba(255,226,187,.55);
       background:rgba(36,20,13,.78);color:#fff2dc;padding:12px 22px;border-radius:999px;
       font-family:inherit;font-size:15px;letter-spacing:.04em;cursor:pointer;
       backdrop-filter:blur(8px);box-shadow:0 8px 25px rgba(0,0,0,.3)}
  .open-btn{bottom:28px;left:50%;transform:translateX(-50%)}
  .close-btn{top:58px;right:24px;display:none}
  .open-btn:hover,.close-btn:hover{background:rgba(77,42,26,.9)}
  .page-wrap{width:100%;height:100%;position:relative;border-radius:8px;
             box-shadow:0 25px 70px rgba(0,0,0,.55)}
  .page-content{width:100%;height:100%;background:#efe1cb;overflow:hidden}
  .page-content canvas{width:100%;height:100%;display:block}
  .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
           background:#efe1cb;color:#6b4a36;font-size:15px;z-index:2}
  .controls{position:absolute;bottom:54px;left:50%;transform:translateX(-50%);z-index:25;
            display:flex;gap:8px;align-items:center}
  .ctrl{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,230,200,.4);
        background:rgba(34,20,14,.76);color:#fff;cursor:pointer;font-size:18px}
  .counter{min-width:78px;text-align:center;font:13px Arial,sans-serif;color:#ead8c2}
  .hint{position:absolute;bottom:20px;z-index:25;font:11px Arial,sans-serif;color:#cbb8a2}
  @keyframes openCover{0%{transform:rotateY(0deg)}100%{transform:rotateY(-110deg)}}
  .opening .closed-cover{animation:openCover 1.15s cubic-bezier(.2,.75,.2,1) forwards}
  @media(max-width:650px){
    .stage{width:min(88vw,430px);height:min(78vh,700px)}
    .title{top:10px;font-size:12px}
    .controls{bottom:44px}
    .close-btn{top:40px;right:12px}
  }
</style>
</head>
<body>
<div class="app">
  <div class="title">THE BOY WHO ASKED IF I WAS ARTIFICIAL</div>

  <div class="stage" id="stage">
    <div class="closed-book" id="closedBook">
      <div class="closed-cover">
        <img src="novel.pdf" id="dummyCover" alt="">
        <!-- Cover image is generated from the PDF by the script below. -->
        <canvas id="coverCanvas" style="position:absolute;inset:0;width:100%;height:100%;display:block"></canvas>
      </div>
      <button class="open-btn" id="openBtn">Open the book ♥</button>
    </div>

    <div id="book"></div>
    <div class="controls" id="controls" style="display:none">
      <button class="ctrl" id="prevBtn" aria-label="Previous page">‹</button>
      <div class="counter" id="counter">1 / 19</div>
      <button class="ctrl" id="nextBtn" aria-label="Next page">›</button>
    </div>
    <button class="close-btn" id="closeBtn">Close book</button>
    <div class="hint" id="hint" style="display:none">Drag or tap the page corner to turn • sound plays on each turn</div>
  </div>

  <div class="subtitle">A little digital hardcover • made with love</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
(() => {
  const pdfUrl = "novel.pdf";
  const closedBook = document.getElementById("closedBook");
  const openBtn = document.getElementById("openBtn");
  const closeBtn = document.getElementById("closeBtn");
  const controls = document.getElementById("controls");
  const hint = document.getElementById("hint");
  const bookEl = document.getElementById("book");
  const counter = document.getElementById("counter");
  const coverCanvas = document.getElementById("coverCanvas");
  const dummyCover = document.getElementById("dummyCover");

  let pdf = null, pageFlip = null, audioCtx = null;

  // The browser cannot display a PDF as an <img>. Hide that fallback element.
  dummyCover.style.display = "none";

  async function loadPdf() {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    pdf = await pdfjsLib.getDocument(pdfUrl).promise;

    // Render page 1 into the closed hardcover.
    const first = await pdf.getPage(1);
    const vp = first.getViewport({scale: 1});
    const scale = Math.min(1200/vp.width, 1600/vp.height);
    const v = first.getViewport({scale});
    coverCanvas.width = v.width;
    coverCanvas.height = v.height;
    await first.render({canvasContext: coverCanvas.getContext("2d"), viewport:v}).promise;

    const pages = [];
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const viewport = page.getViewport({scale: 1.5});
      const canvas = document.createElement("canvas");
      canvas.width = Math.ceil(viewport.width);
      canvas.height = Math.ceil(viewport.height);
      canvas.style.width = "100%";
      canvas.style.height = "100%";
      canvas.style.display = "block";
      await page.render({canvasContext: canvas.getContext("2d"), viewport}).promise;

      const wrapper = document.createElement("div");
      wrapper.className = "page-content";
      wrapper.appendChild(canvas);
      pages.push(wrapper);
    }

    bookEl.style.visibility = "visible";
    bookEl.style.opacity = "1";

    pageFlip = new St.PageFlip(bookEl, {
      width: Math.max(420, Math.min(560, Math.round(window.innerWidth * .76))),
      height: Math.max(560, Math.min(760, Math.round(window.innerHeight * .76))),
      size: "stretch",
      minWidth: 260,
      maxWidth: 700,
      minHeight: 360,
      maxHeight: 900,
      drawShadow: true,
      flippingTime: 850,
      usePortrait: true,
      startPage: 0,
      autoSize: true,
      maxShadowOpacity: .35,
      showCover: true,
      mobileScrollSupport: false,
      swipeDistance: 30,
      clickEventForward: true
    });

    pageFlip.loadFromHTML(pages);

    pageFlip.on("flip", e => {
      counter.textContent = `${e.data + 1} / ${pdf.numPages}`;
      playFlipSound();
    });
  }

  function playFlipSound() {
    // Short paper-like sound synthesized locally: no audio file or tracking.
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      const now = audioCtx.currentTime;
      const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * .13, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i=0;i<data.length;i++) {
        const t=i/data.length;
        data[i]=(Math.random()*2-1)*Math.pow(1-t,2.2)*0.12;
      }
      const src=audioCtx.createBufferSource();
      const filter=audioCtx.createBiquadFilter();
      const gain=audioCtx.createGain();
      filter.type="bandpass"; filter.frequency.value=2100; filter.Q.value=.8;
      gain.gain.setValueAtTime(.0001,now);
      gain.gain.exponentialRampToValueAtTime(.22,now+.012);
      gain.gain.exponentialRampToValueAtTime(.0001,now+.12);
      src.buffer=buffer; src.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
      src.start(now);
    } catch(e) {}
  }

  openBtn.addEventListener("click", async () => {
    if (!pageFlip) await loadPdf();
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    closedBook.classList.add("opening");
    playFlipSound();
    setTimeout(() => {
      closedBook.classList.add("hide");
      controls.style.display = "flex";
      closeBtn.style.display = "block";
      hint.style.display = "block";
    }, 1050);
  });

  closeBtn.addEventListener("click", () => {
    closedBook.classList.remove("hide");
    closedBook.classList.remove("opening");
    controls.style.display = "none";
    closeBtn.style.display = "none";
    hint.style.display = "none";
    if (pageFlip) pageFlip.turnToPage(0);
    setTimeout(() => {
      closedBook.classList.add("opening");
      playFlipSound();
      setTimeout(() => closedBook.classList.remove("opening"), 1150);
    }, 40);
  });

  document.getElementById("prevBtn").addEventListener("click", () => pageFlip && pageFlip.flipPrev());
  document.getElementById("nextBtn").addEventListener("click", () => pageFlip && pageFlip.flipNext());

  document.addEventListener("keydown", e => {
    if (!pageFlip) return;
    if (e.key === "ArrowLeft") pageFlip.flipPrev();
    if (e.key === "ArrowRight") pageFlip.flipNext();
    if (e.key === "Escape") closeBtn.click();
  });

  loadPdf().catch(err => {
    console.error(err);
    openBtn.textContent = "Open book";
  });
})();
</script>
</body>
</html>
