<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Boy Who Asked If I Was Artificial</title>

<!--
  DIGITAL HARDCOVER
  Put this index.html in the SAME GitHub repository/folder as:
      novel.pdf

  The first page of novel.pdf is used as the actual front cover.
  The last PDF page is the back cover.
-->

<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    min-height: 100dvh;
    overflow: hidden;
    overscroll-behavior: none;
    background: #17100d;
  }

  body {
    font-family: Georgia, "Times New Roman", serif;
    color: #f8ead7;
  }

  #app {
    width: 100%;
    height: 100%;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background:
      radial-gradient(circle at 50% 42%, rgba(116, 73, 43, .28), transparent 45%),
      linear-gradient(135deg, #120c0a, #302018 55%, #100b09);
  }

  #bookStage {
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    position: relative;
    perspective: 1800px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: visible;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }

  #book {
    width: 100%;
    height: 100%;
    margin: auto;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }

  /* PDF pages keep their native portrait ratio and fill the available viewport. */
  .page {
    width: 100%;
    height: 100%;
    background: #f0e2cc;
    overflow: hidden;
    position: relative;
  }

  .page canvas {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    background: #f0e2cc;
  }

  /* Synthetic outer back cover used only for the final closing motion. */
  .back-cover-page {
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
    background: linear-gradient(90deg, #3b1b12 0%, #5b2d1d 48%, #32150f 100%);
    box-shadow:
      inset 0 0 0 4px rgba(28, 10, 5, .45),
      inset 10px 0 18px rgba(0,0,0,.28),
      inset -8px 0 14px rgba(255,255,255,.035);
  }

  .back-cover-page::before {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px solid rgba(234,215,189,.16);
    border-radius: 2px;
  }

  .back-cover-page::after {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 12px;
    background: linear-gradient(90deg, rgba(0,0,0,.28), rgba(255,255,255,.03), transparent);
  }

  /* Hardcover edges */
  .page[data-density="hard"] {
    background: #5b2d1d;
    box-shadow:
      inset 0 0 0 3px rgba(44, 19, 11, .25),
      inset 9px 0 16px rgba(0,0,0,.20);
  }

  #loading {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #211511;
    color: #ead7bd;
    z-index: 100;
    text-align: center;
    padding: 25px;
  }

  #loading .spinner {
    width: 34px;
    height: 34px;
    border: 3px solid rgba(255,255,255,.2);
    border-top-color: #ead7bd;
    border-radius: 50%;
    animation: spin .8s linear infinite;
    margin-bottom: 15px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  #welcome {
    position: absolute;
    inset: 0;
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  #welcomePanel {
    text-align: center;
    pointer-events: auto;
    transform: translateY(0);
    transition: opacity .4s ease, transform .4s ease;
  }

  #welcomePanel.hide {
    opacity: 0;
    transform: translateY(10px);
    pointer-events: none;
  }

  #openBook {
    border: 1px solid rgba(255, 231, 201, .7);
    border-radius: 999px;
    padding: 13px 25px;
    background: rgba(39, 20, 12, .86);
    color: #fff1dd;
    font: 16px Georgia, serif;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
    backdrop-filter: blur(5px);
  }

  #openBook:hover {
    background: rgba(83, 43, 26, .95);
  }

  #controls {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 9px;
    z-index: 300;
  }

  .control {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid rgba(255, 230, 200, .5);
    background: rgba(35,20,13,.88);
    color: #fff1dd;
    cursor: pointer;
    font-size: 22px;
    line-height: 1;
  }

  .control:hover { background: rgba(83,43,26,.95); }

  #counter {
    min-width: 70px;
    text-align: center;
    font: 12px Arial, sans-serif;
    color: #ead7bd;
  }

  .hidden { display: none !important; }

  #hint {
    position: fixed;
    bottom: 70px;
    left: 0;
    right: 0;
    text-align: center;
    font: 11px Arial, sans-serif;
    color: rgba(234,215,189,.75);
    z-index: 300;
    pointer-events: none;
  }

  @media (max-width: 600px) {
    #controls { bottom: 10px; }
    #hint { bottom: 58px; }
  }
</style>
</head>

<body>
<div id="app">

  <div id="bookStage">
    <div id="book"></div>

    <div id="loading">
      <div class="spinner"></div>
      <div>Preparing your book…</div>
    </div>

    <div id="welcome">
      <div id="welcomePanel">
        <button id="openBook">Open the book ♥</button>
      </div>
    </div>
  </div>

  <div id="controls" class="hidden">
    <button class="control" id="prev" aria-label="Previous page">‹</button>
    <span id="counter">1 / 19</span>
    <button class="control" id="next" aria-label="Next page">›</button>
  </div>

  <div id="hint" class="hidden">
    Swipe or drag the page • tap the sides or use the arrows
  </div>
</div>

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<!-- StPageFlip -->
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

<script>
(() => {
  "use strict";

  const PDF_FILE = "novel.pdf";

  const bookStage = document.getElementById("bookStage");
  const bookEl = document.getElementById("book");
  const loading = document.getElementById("loading");
  const welcome = document.getElementById("welcome");
  const welcomePanel = document.getElementById("welcomePanel");
  const openBook = document.getElementById("openBook");
  const controls = document.getElementById("controls");
  const hint = document.getElementById("hint");
  const counter = document.getElementById("counter");
  const prev = document.getElementById("prev");
  const next = document.getElementById("next");

  let pdfDoc = null;
  let pageFlip = null;
  let audioContext = null;
  let pageCount = 0;
  let isOpen = false;
  let renderedPages = [];
  let rebuilding = false;
  let flipPageCount = 0;

  /*
    A5 is 148 x 210 mm.
    Ratio = 148 / 210 = 0.7047619.
    The PDF itself supplies the exact page dimensions; this ratio is used
    only for sizing the digital book on screen.
  */
  // Detect the actual PDF page ratio after the PDF loads. A5 is only the fallback.
  let PAGE_RATIO = 148 / 210;

  function viewportSize() {
    /*
      IMPORTANT FOR iPAD CHROME / DESKTOP DEVICE EMULATION:
      visualViewport can report the *layout viewport after device scaling*
      (for example 768x1024) even when the CSS viewport is 1032x1376.
      Using it for the book size makes the book unnecessarily small.

      Use the CSS layout viewport first. It is the coordinate system used by
      the page and by StPageFlip. visualViewport is only used as a fallback.
    */
    const width = Math.max(1,
      document.documentElement.clientWidth ||
      window.innerWidth ||
      (window.visualViewport ? window.visualViewport.width : 1)
    );

    const height = Math.max(1,
      document.documentElement.clientHeight ||
      window.innerHeight ||
      (window.visualViewport ? window.visualViewport.height : 1)
    );

    return { width, height };
  }

  function setBookSize() {
    const { width: viewportWidth, height: viewportHeight } = viewportSize();

    // Use the entire CSS viewport. Keep the PDF's portrait ratio so the
    // complete page remains visible without cropping.
    const safeWidth = viewportWidth;
    const safeHeight = viewportHeight;

    let width = safeWidth;
    let height = width / PAGE_RATIO;

    if (height > safeHeight) {
      height = safeHeight;
      width = height * PAGE_RATIO;
    }

    // Do not shrink because of visualViewport/device-pixel scaling.
    width = Math.floor(width);
    height = Math.floor(height);

    bookStage.style.width = width + 'px';
    bookStage.style.height = height + 'px';
    bookStage.style.maxWidth = 'none';
    bookStage.style.maxHeight = 'none';

    // Keep the page-flip swipe threshold tied to the actual visible page.
    if (pageFlip && pageFlip.getSettings) {
      try {
        pageFlip.getSettings().swipeDistance = Math.max(140, Math.round(width * 0.50));
      } catch (_) {}
    }
  }

  let resizeTimer = null;
  function handleViewportChange() {
    setBookSize();
    if (pageFlip && isOpen) {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => rebuildPortraitBook(), 180);
    }
  }

  setBookSize();
  window.addEventListener('resize', handleViewportChange);
  window.addEventListener('orientationchange', () => setTimeout(handleViewportChange, 180));
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', handleViewportChange);
  }

  /*
    Small paper-rustle sound generated locally.
    No sound file is required.
  */
  function pageSound() {
    try {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }

      if (audioContext.state === "suspended") {
        audioContext.resume();
      }

      const duration = 0.13;
      const length = Math.floor(audioContext.sampleRate * duration);
      const buffer = audioContext.createBuffer(1, length, audioContext.sampleRate);
      const data = buffer.getChannelData(0);

      for (let i = 0; i < length; i++) {
        const t = i / length;
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 2.3) * 0.11;
      }

      const source = audioContext.createBufferSource();
      const filter = audioContext.createBiquadFilter();
      const gain = audioContext.createGain();

      filter.type = "bandpass";
      filter.frequency.value = 2200;
      filter.Q.value = 0.8;

      gain.gain.setValueAtTime(0.0001, audioContext.currentTime);
      gain.gain.exponentialRampToValueAtTime(.18, audioContext.currentTime + .012);
      gain.gain.exponentialRampToValueAtTime(.0001, audioContext.currentTime + .12);

      source.buffer = buffer;
      source.connect(filter);
      filter.connect(gain);
      gain.connect(audioContext.destination);
      source.start();
    } catch (e) {
      // Sound is optional; page flipping still works.
    }
  }

  async function renderPDFPage(pdfPage, scale) {
    const viewport = pdfPage.getViewport({ scale });

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d", { alpha: false });

    canvas.width = Math.ceil(viewport.width);
    canvas.height = Math.ceil(viewport.height);

    await pdfPage.render({
      canvasContext: ctx,
      viewport: viewport
    }).promise;

    return canvas;
  }

  function swipeThreshold() {
    // The request is intentionally based on the visible page width, not a
    // fixed pixel value, so it behaves consistently on iPad fullscreen,
    // portrait and landscape.
    return Math.max(140, Math.round(bookStage.clientWidth * 0.50));
  }

  async function createBook() {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    pdfDoc = await pdfjsLib.getDocument({
      url: PDF_FILE,
      disableAutoFetch: false,
      disableStream: false
    }).promise;

    pageCount = pdfDoc.numPages;

    // Read the actual first-page dimensions instead of assuming A5.
    const firstPdfPage = await pdfDoc.getPage(1);
    const firstViewport = firstPdfPage.getViewport({ scale: 1 });
    PAGE_RATIO = firstViewport.width / firstViewport.height;
    setBookSize();

    /*
      Render every PDF page to a canvas.
      The actual first PDF page is therefore the actual front cover —
      no replacement cover image is used.
    */
    const pages = [];

    for (let i = 1; i <= pageCount; i++) {
      const pdfPage = await pdfDoc.getPage(i);

      /*
        A moderate render scale keeps the site responsive while preserving
        the original A5 artwork at normal reading size.
      */
      const canvas = await renderPDFPage(pdfPage, 1.7);

      const page = document.createElement("div");
      page.className = "page";

      /*
        The first PDF page is the front hardcover.
        The final PDF page is kept as the final inside/back-cover artwork.
        A separate synthetic hardcover is added below so the very last
        gesture visibly closes the book and leaves the outside back cover.
      */
      if (i === 1) {
        page.dataset.density = "hard";
      }

      page.appendChild(canvas);
      pages.push(page);
    }

    // Add one physical-looking outer back cover. This is deliberately a
    // hard page so the final swipe performs the same closing motion as a
    // real hardcover book. It has no PDF content on purpose: it represents
    // the outside/back of the book after the final story page.
    const backCover = document.createElement("div");
    backCover.className = "back-cover-page";
    backCover.dataset.density = "hard";
    pages.push(backCover);

    // The visible story counter remains based on the PDF pages. The synthetic
    // cover is mapped to the same final display number (19 / 19).
    flipPageCount = pages.length;

    // FORCE PORTRAIT / SINGLE-PAGE MODE.
    // We give StPageFlip a portrait-sized page and use fixed sizing so it
    // cannot turn the iPad screen into a two-page spread. The outer stage
    // can still be full-screen; only the actual book page is portrait.
    const pageWidth = Math.max(220, Math.floor(bookStage.clientWidth));
    const pageHeight = Math.max(300, Math.floor(pageWidth / PAGE_RATIO));
    const fittedHeight = Math.min(bookStage.clientHeight, pageHeight);
    const fittedWidth = Math.max(220, Math.floor(fittedHeight * PAGE_RATIO));

    bookStage.style.width = fittedWidth + "px";
    bookStage.style.height = fittedHeight + "px";

    pageFlip = new St.PageFlip(bookEl, {
      width: fittedWidth,
      height: fittedHeight,
      size: "fixed",

      // Fixed portrait dimensions + usePortrait keep every PDF page
      // as ONE visible page on iPad, including when the device is rotated.
      minWidth: fittedWidth,
      maxWidth: fittedWidth,
      minHeight: fittedHeight,
      maxHeight: fittedHeight,

      startPage: 0,

      /*
        This is the important part:
        - true = first and last pages are hard covers
        - true portrait = one page at a time
        - false disableFlipByClick = clicking the page flips it
      */
      showCover: true,
      usePortrait: true,
      disableFlipByClick: false,

      // Make a deliberate swipe: the page does not commit to a turn
      // until the finger has travelled roughly half the visible page.
      flippingTime: 680,
      drawShadow: true,
      maxShadowOpacity: 0.28,
      // Let StPageFlip own the gesture. touch-action:none above prevents
      // Chrome on iPad from stealing the horizontal swipe for page scrolling.
      // iPad/Chrome: let the flip engine receive the complete touch gesture.
      // A swipe must travel about half the visible page before it commits.
      mobileScrollSupport: false,
      useMouseEvents: true,
      swipeDistance: swipeThreshold(),
      clickEventForward: true,
      // Do not let the library resize the parent into a landscape spread.
      autoSize: false
    });

    renderedPages = pages;
    pageFlip.loadFromHTML(renderedPages);

    // If the library ever reports landscape, immediately rebuild the
    // portrait book. This is a safety net for iPad Chrome resize/fullscreen.
    pageFlip.on("changeOrientation", (e) => {
      if (e.data === "landscape") {
        requestAnimationFrame(() => rebuildPortraitBook());
      }
    });

    pageFlip.on("flip", (e) => {
      const displayPage = Math.min(e.data + 1, pageCount);
      counter.textContent = `${displayPage} / ${pageCount}`;
      pageSound();
    });

    loading.classList.add("hidden");
  }

  function rebuildPortraitBook() {
    if (!pageFlip || rebuilding || !renderedPages.length) return;
    rebuilding = true;

    const currentPage = Math.max(0, pageFlip.getCurrentPageIndex ? pageFlip.getCurrentPageIndex() : 0);

    try { pageFlip.destroy(); } catch (_) {}
    bookEl.innerHTML = "";

    // Reuse the already-rendered PDF pages; no PDF re-render is needed.
    const pages = renderedPages;
    const h = Math.max(300, Math.floor(bookStage.clientHeight));
    const w = Math.max(220, Math.floor(h * PAGE_RATIO));
    bookStage.style.width = w + "px";
    bookStage.style.height = h + "px";

    pageFlip = new St.PageFlip(bookEl, {
      width: w,
      height: h,
      size: "fixed",
      minWidth: w, maxWidth: w,
      minHeight: h, maxHeight: h,
      startPage: Math.min(currentPage, flipPageCount - 1),
      showCover: true,
      usePortrait: true,
      disableFlipByClick: false,
      flippingTime: 680,
      drawShadow: true,
      maxShadowOpacity: 0.28,
      mobileScrollSupport: false,
      useMouseEvents: true,
      swipeDistance: Math.max(140, Math.round(w * 0.50)),
      clickEventForward: true,
      autoSize: false
    });

    pageFlip.loadFromHTML(pages);
    pageFlip.on("flip", (e) => {
      const displayPage = Math.min(e.data + 1, pageCount);
      counter.textContent = `${displayPage} / ${pageCount}`;
      pageSound();
    });

    rebuilding = false;
  }

  // StPageFlip handles both tap/click and touch/trackpad swipes.
  // We deliberately do not add a second click handler here, because a
  // click fired after a swipe can otherwise trigger an unwanted extra page turn.

  openBook.addEventListener("click", async (event) => {
    event.stopPropagation();

    if (!pageFlip) {
      try {
        openBook.disabled = true;
        openBook.textContent = "Opening…";
        await createBook();
      } catch (error) {
        console.error(error);
        loading.innerHTML =
          "<strong>Could not load novel.pdf</strong><br><br>" +
          "Make sure novel.pdf is in the same GitHub folder as index.html.";
        openBook.disabled = false;
        openBook.textContent = "Try again";
        return;
      }
    }

    if (audioContext && audioContext.state === "suspended") {
      audioContext.resume();
    }

    pageSound();

    isOpen = true;
    welcomePanel.classList.add("hide");

    setTimeout(() => {
      welcome.classList.add("hidden");
      controls.classList.remove("hidden");
      hint.classList.remove("hidden");
    }, 450);
  });

  next.addEventListener("click", (e) => {
    e.stopPropagation();
    if (pageFlip) pageFlip.flipNext("bottom");
  });

  prev.addEventListener("click", (e) => {
    e.stopPropagation();
    if (pageFlip) pageFlip.flipPrev("bottom");
  });

  /*
    Keyboard support on Mac.
  */
  document.addEventListener("keydown", (event) => {
    if (!pageFlip || !isOpen) return;

    if (event.key === "ArrowRight") {
      pageFlip.flipNext("bottom");
    }

    if (event.key === "ArrowLeft") {
      pageFlip.flipPrev("bottom");
    }

  });

})();
</script>
</body>
</html>
