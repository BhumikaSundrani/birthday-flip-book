<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Boy Who Asked If I Was Artificial</title>

<!--
  DIGITAL HARDCOVER
  Put this index.html in the SAME GitHub repository/folder as:
      novel.pdf

  The first page of novel.pdf is used as the actual front cover.
  The last PDF page is the back cover.
-->

<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #17100d;
  }

  body {
    font-family: Georgia, "Times New Roman", serif;
    color: #f8ead7;
  }

  #app {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background:
      radial-gradient(circle at 50% 42%, rgba(116, 73, 43, .28), transparent 45%),
      linear-gradient(135deg, #120c0a, #302018 55%, #100b09);
  }

  #bookStage {
    width: min(88vw, 520px);
    height: min(82vh, 735px);
    position: relative;
    perspective: 1800px;
  }

  #book {
    width: 100%;
    height: 100%;
    margin: auto;
  }

  /* Every PDF page is kept at the A5 portrait ratio. */
  .page {
    width: 100%;
    height: 100%;
    background: #f0e2cc;
    overflow: hidden;
    position: relative;
  }

  .page canvas {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    background: #f0e2cc;
  }

  /* Hardcover edges */
  .page[data-density="hard"] {
    background: #5b2d1d;
    box-shadow:
      inset 0 0 0 3px rgba(44, 19, 11, .25),
      inset 9px 0 16px rgba(0,0,0,.20);
  }

  #loading {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #211511;
    color: #ead7bd;
    z-index: 100;
    text-align: center;
    padding: 25px;
  }

  #loading .spinner {
    width: 34px;
    height: 34px;
    border: 3px solid rgba(255,255,255,.2);
    border-top-color: #ead7bd;
    border-radius: 50%;
    animation: spin .8s linear infinite;
    margin-bottom: 15px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  #welcome {
    position: absolute;
    inset: 0;
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }

  #welcomePanel {
    text-align: center;
    pointer-events: auto;
    transform: translateY(0);
    transition: opacity .4s ease, transform .4s ease;
  }

  #welcomePanel.hide {
    opacity: 0;
    transform: translateY(10px);
    pointer-events: none;
  }

  #openBook {
    border: 1px solid rgba(255, 231, 201, .7);
    border-radius: 999px;
    padding: 13px 25px;
    background: rgba(39, 20, 12, .86);
    color: #fff1dd;
    font: 16px Georgia, serif;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
    backdrop-filter: blur(5px);
  }

  #openBook:hover {
    background: rgba(83, 43, 26, .95);
  }

  #title {
    position: fixed;
    top: 16px;
    left: 20px;
    right: 20px;
    text-align: center;
    font-size: clamp(11px, 1.8vw, 18px);
    letter-spacing: .09em;
    color: #ead7bd;
    z-index: 300;
    pointer-events: none;
  }

  #controls {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 9px;
    z-index: 300;
  }

  .control {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid rgba(255, 230, 200, .5);
    background: rgba(35,20,13,.88);
    color: #fff1dd;
    cursor: pointer;
    font-size: 22px;
    line-height: 1;
  }

  .control:hover { background: rgba(83,43,26,.95); }

  #counter {
    min-width: 70px;
    text-align: center;
    font: 12px Arial, sans-serif;
    color: #ead7bd;
  }

  #closeBook {
    position: fixed;
    top: 48px;
    right: 18px;
    z-index: 300;
    border: 1px solid rgba(255,230,200,.45);
    border-radius: 999px;
    padding: 8px 14px;
    background: rgba(35,20,13,.75);
    color: #f5e4ce;
    cursor: pointer;
    display: none;
  }

  .hidden { display: none !important; }

  #hint {
    position: fixed;
    bottom: 70px;
    left: 0;
    right: 0;
    text-align: center;
    font: 11px Arial, sans-serif;
    color: rgba(234,215,189,.75);
    z-index: 300;
    pointer-events: none;
  }

  @media (max-width: 600px) {
    #bookStage {
      width: min(88vw, 430px);
      height: min(78vh, 610px);
    }

    #closeBook { top: 40px; right: 10px; }
  }
</style>
</head>

<body>
<div id="app">

  <div id="title">THE BOY WHO ASKED IF I WAS ARTIFICIAL</div>

  <div id="bookStage">
    <div id="book"></div>

    <div id="loading">
      <div class="spinner"></div>
      <div>Preparing your book…</div>
    </div>

    <div id="welcome">
      <div id="welcomePanel">
        <button id="openBook">Open the book ♥</button>
      </div>
    </div>
  </div>

  <button id="closeBook">Close book</button>

  <div id="controls" class="hidden">
    <button class="control" id="prev" aria-label="Previous page">‹</button>
    <span id="counter">1 / 19</span>
    <button class="control" id="next" aria-label="Next page">›</button>
  </div>

  <div id="hint" class="hidden">
    Click anywhere on the page or use the arrows • drag the corner for a natural page turn
  </div>
</div>

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<!-- StPageFlip -->
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>

<script>
(() => {
  "use strict";

  const PDF_FILE = "novel.pdf";

  const bookStage = document.getElementById("bookStage");
  const bookEl = document.getElementById("book");
  const loading = document.getElementById("loading");
  const welcome = document.getElementById("welcome");
  const welcomePanel = document.getElementById("welcomePanel");
  const openBook = document.getElementById("openBook");
  const closeBook = document.getElementById("closeBook");
  const controls = document.getElementById("controls");
  const hint = document.getElementById("hint");
  const counter = document.getElementById("counter");
  const prev = document.getElementById("prev");
  const next = document.getElementById("next");

  let pdfDoc = null;
  let pageFlip = null;
  let audioContext = null;
  let pageCount = 0;
  let isOpen = false;

  /*
    A5 is 148 x 210 mm.
    Ratio = 148 / 210 = 0.7047619.
    The PDF itself supplies the exact page dimensions; this ratio is used
    only for sizing the digital book on screen.
  */
  const A5_RATIO = 148 / 210;

  function setBookSize() {
    const maxW = Math.min(window.innerWidth * 0.88, 520);
    const maxH = Math.min(window.innerHeight * 0.82, 735);

    let width = maxW;
    let height = width / A5_RATIO;

    if (height > maxH) {
      height = maxH;
      width = height * A5_RATIO;
    }

    bookStage.style.width = Math.round(width) + "px";
    bookStage.style.height = Math.round(height) + "px";
  }

  setBookSize();
  window.addEventListener("resize", setBookSize);

  /*
    Small paper-rustle sound generated locally.
    No sound file is required.
  */
  function pageSound() {
    try {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }

      if (audioContext.state === "suspended") {
        audioContext.resume();
      }

      const duration = 0.13;
      const length = Math.floor(audioContext.sampleRate * duration);
      const buffer = audioContext.createBuffer(1, length, audioContext.sampleRate);
      const data = buffer.getChannelData(0);

      for (let i = 0; i < length; i++) {
        const t = i / length;
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 2.3) * 0.11;
      }

      const source = audioContext.createBufferSource();
      const filter = audioContext.createBiquadFilter();
      const gain = audioContext.createGain();

      filter.type = "bandpass";
      filter.frequency.value = 2200;
      filter.Q.value = 0.8;

      gain.gain.setValueAtTime(0.0001, audioContext.currentTime);
      gain.gain.exponentialRampToValueAtTime(.18, audioContext.currentTime + .012);
      gain.gain.exponentialRampToValueAtTime(.0001, audioContext.currentTime + .12);

      source.buffer = buffer;
      source.connect(filter);
      filter.connect(gain);
      gain.connect(audioContext.destination);
      source.start();
    } catch (e) {
      // Sound is optional; page flipping still works.
    }
  }

  async function renderPDFPage(pdfPage, scale) {
    const viewport = pdfPage.getViewport({ scale });

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d", { alpha: false });

    canvas.width = Math.ceil(viewport.width);
    canvas.height = Math.ceil(viewport.height);

    await pdfPage.render({
      canvasContext: ctx,
      viewport: viewport
    }).promise;

    return canvas;
  }

  async function createBook() {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    pdfDoc = await pdfjsLib.getDocument({
      url: PDF_FILE,
      disableAutoFetch: false,
      disableStream: false
    }).promise;

    pageCount = pdfDoc.numPages;

    /*
      Render every PDF page to a canvas.
      The actual first PDF page is therefore the actual front cover —
      no replacement cover image is used.
    */
    const pages = [];

    for (let i = 1; i <= pageCount; i++) {
      const pdfPage = await pdfDoc.getPage(i);

      /*
        A moderate render scale keeps the site responsive while preserving
        the original A5 artwork at normal reading size.
      */
      const canvas = await renderPDFPage(pdfPage, 1.7);

      const page = document.createElement("div");
      page.className = "page";

      /*
        First and last pages are hard covers.
        StPageFlip's showCover option also makes them single-page covers.
      */
      if (i === 1 || i === pageCount) {
        page.dataset.density = "hard";
      }

      page.appendChild(canvas);
      pages.push(page);
    }

    pageFlip = new St.PageFlip(bookEl, {
      width: 420,
      height: 595,          // A5 proportion
      size: "stretch",

      minWidth: 260,
      maxWidth: 520,
      minHeight: 370,
      maxHeight: 735,

      startPage: 0,

      /*
        This is the important part:
        - true = first and last pages are hard covers
        - true portrait = one page at a time
        - false disableFlipByClick = clicking the page flips it
      */
      showCover: true,
      usePortrait: true,
      disableFlipByClick: false,

      flippingTime: 850,
      drawShadow: true,
      maxShadowOpacity: 0.38,
      mobileScrollSupport: false,
      useMouseEvents: true,
      swipeDistance: 20,
      clickEventForward: true,
      autoSize: true
    });

    pageFlip.loadFromHTML(pages);

    pageFlip.on("flip", (e) => {
      counter.textContent = `${e.data + 1} / ${pageCount}`;
      pageSound();
    });

    loading.classList.add("hidden");
  }

  /*
    Explicit click zones.
    This makes clicking the left/right side work even if a browser's
    event handling behaves differently from the library's default.
  */
  bookEl.addEventListener("click", (event) => {
    if (!pageFlip || !isOpen) return;

    const rect = bookEl.getBoundingClientRect();
    const x = event.clientX - rect.left;

    if (x > rect.width * 0.52) {
      if (pageFlip.getCurrentPageIndex() < pageCount - 1) {
        pageFlip.flipNext("bottom");
      }
    } else {
      if (pageFlip.getCurrentPageIndex() > 0) {
        pageFlip.flipPrev("bottom");
      }
    }
  });

  openBook.addEventListener("click", async (event) => {
    event.stopPropagation();

    if (!pageFlip) {
      try {
        openBook.disabled = true;
        openBook.textContent = "Opening…";
        await createBook();
      } catch (error) {
        console.error(error);
        loading.innerHTML =
          "<strong>Could not load novel.pdf</strong><br><br>" +
          "Make sure novel.pdf is in the same GitHub folder as index.html.";
        openBook.disabled = false;
        openBook.textContent = "Try again";
        return;
      }
    }

    if (audioContext && audioContext.state === "suspended") {
      audioContext.resume();
    }

    pageSound();

    isOpen = true;
    welcomePanel.classList.add("hide");

    setTimeout(() => {
      welcome.classList.add("hidden");
      controls.classList.remove("hidden");
      closeBook.style.display = "block";
      hint.classList.remove("hidden");
    }, 450);
  });

  next.addEventListener("click", (e) => {
    e.stopPropagation();
    if (pageFlip) pageFlip.flipNext("bottom");
  });

  prev.addEventListener("click", (e) => {
    e.stopPropagation();
    if (pageFlip) pageFlip.flipPrev("bottom");
  });

  closeBook.addEventListener("click", (e) => {
    e.stopPropagation();

    if (!pageFlip) return;

    pageFlip.flip(0, "bottom");
    pageSound();

    setTimeout(() => {
      isOpen = false;
      welcome.classList.remove("hidden");
      welcomePanel.classList.remove("hide");
      controls.classList.add("hidden");
      hint.classList.add("hidden");
      closeBook.style.display = "none";
      counter.textContent = `1 / ${pageCount}`;
    }, 900);
  });

  /*
    Keyboard support on Mac.
  */
  document.addEventListener("keydown", (event) => {
    if (!pageFlip || !isOpen) return;

    if (event.key === "ArrowRight") {
      pageFlip.flipNext("bottom");
    }

    if (event.key === "ArrowLeft") {
      pageFlip.flipPrev("bottom");
    }

    if (event.key === "Escape") {
      closeBook.click();
    }
  });

})();
</script>
</body>
</html>
